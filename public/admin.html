<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Lazzat FastFood</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="topbar"><div class="container nav"><a class="brand" href="/"><span class="brandmark">🍔</span><span>Lazzat Admin</span></a><a class="pill" href="/">← Sayt</a></div></header>
<main class="order-wrap"><div class="container"><div class="panel"><h1 style="font-family:Manrope;margin-top:0">Buyurtmalar</h1><p class="muted">Admin kalitini kiriting. Kalit serverda `ADMIN_CHAT_ID` asosida yaratiladi.</p><div class="form-row"><input id="key" class="field" style="margin-top:0;padding:13px;border:1px solid var(--line);border-radius:14px" placeholder="Admin kaliti"><button class="btn btn-primary" id="load">Yuklash</button></div><div id="out" style="margin-top:16px"></div></div></div></main>
<script>
const money=n=>`${Number(n).toLocaleString('uz-UZ')} so‘m`;
const out=document.getElementById('out');
document.getElementById('load').onclick=async()=>{out.innerHTML='<div class="muted">Yuklanmoqda...</div>'; const r=await fetch('/api/admin/orders',{headers:{'x-admin-key':document.getElementById('key').value}}); const d=await r.json(); if(!d.ok){out.innerHTML='<div class="notice show error">'+d.message+'</div>';return;} out.innerHTML='<div class="muted" style="margin-bottom:10px">Jami foydalanuvchilar: <b>'+d.users+'</b> · Buyurtmalar: <b>'+d.orders.length+'</b></div><div style="overflow:auto"><table class="admin-table"><thead><tr><th>#</th><th>Mijoz</th><th>Mahsulotlar</th><th>Jami</th><th>Holat</th><th>Sana</th></tr></thead><tbody>'+d.orders.map(o=>'<tr><td><b>'+o.id+'</b></td><td>'+o.customer.name+'<br>'+o.customer.phone+'<br>'+o.customer.address+'</td><td>'+o.items.map(i=>i.name+' × '+i.qty).join('<br>')+'</td><td>'+money(o.total)+'</td><td><span class="status">'+o.status+'</span></td><td>'+new Date(o.createdAt).toLocaleString('uz-UZ')+'</td></tr>').join('')+'</tbody></table></div>';};
</script></body></html>
